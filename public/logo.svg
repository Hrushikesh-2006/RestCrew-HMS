<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Building outline -->
  <rect x="20" y="30" width="80" height="75" rx="3" stroke="#1565C0" stroke-width="4" fill="white"/>
  <!-- Roof / triangular top perspective -->
  <polygon points="15,35 60,8 105,35" stroke="#1E88E5" stroke-width="3.5" stroke-linejoin="round" fill="#E3F2FD"/>
  <!-- Left window -->
  <rect x="28" y="45" width="22" height="18" rx="2" stroke="#1E88E5" stroke-width="2.5" fill="#BBDEFB"/>
  <!-- Right window top row -->
  <rect x="60" y="45" width="10" height="9" rx="1.5" stroke="#1E88E5" stroke-width="2" fill="#BBDEFB"/>
  <rect x="73" y="45" width="10" height="9" rx="1.5" stroke="#1E88E5" stroke-width="2" fill="#BBDEFB"/>
  <!-- Right window bottom row -->
  <rect x="60" y="57" width="10" height="9" rx="1.5" stroke="#1E88E5" stroke-width="2" fill="#BBDEFB"/>
  <rect x="73" y="57" width="10" height="9" rx="1.5" stroke="#1E88E5" stroke-width="2" fill="#BBDEFB"/>
  <!-- Door arch / keyhole -->
  <path d="M52 105 L52 80 Q60 70 68 80 L68 105 Z" stroke="#1565C0" stroke-width="2.5" fill="#90CAF9"/>
  <circle cx="60" cy="76" r="5" stroke="#1565C0" stroke-width="2" fill="#E3F2FD"/>
  <!-- Person silhouette -->
  <circle cx="78" cy="77" r="5" stroke="#1565C0" stroke-width="2" fill="#90CAF9"/>
  <path d="M72 105 Q72 88 78 86 Q84 88 84 105" stroke="#1565C0" stroke-width="2.5" fill="#90CAF9" stroke-linejoin="round"/>
  <!-- Ground line -->
